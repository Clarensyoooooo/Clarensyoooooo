<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#0B1326"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="150" y1="40" x2="750" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="450" y1="40" x2="450" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="shine" x1="160" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- drifting light blobs (liquid layer) -->
  <g filter="url(#soft)">
    <circle cx="170" cy="70" r="150" fill="url(#blob1)">
      <animate attributeName="cx" values="170;240;170" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="220" r="170" fill="url(#blob2)">
      <animate attributeName="cx" values="760;680;760" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;160;220" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="40" r="120" fill="url(#blob3)">
      <animate attributeName="cx" values="520;580;520" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- subtle grid texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.03">
    <path d="M0 70H900"/><path d="M0 140H900"/><path d="M0 210H900"/>
    <path d="M150 0V280"/><path d="M300 0V280"/><path d="M450 0V280"/><path d="M600 0V280"/><path d="M750 0V280"/>
  </g>

  <!-- glass card -->
  <g>
    <rect x="150" y="42" width="600" height="196" rx="28" fill="url(#cardFill)" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <!-- top highlight -->
    <rect x="160" y="43" width="580" height="1.5" fill="url(#shine)"/>
  </g>

  <!-- name + tagline -->
  <text x="450" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="650" fill="#F8FAFC" letter-spacing="0.5">Clarence Neil Meneses</text>
  <text x="450" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8" letter-spacing="2">FULL-STACK DEVELOPER&#160;&#160;·&#160;&#160;DATA &amp; ANALYTICS</text>

  <!-- glass chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="240" y="178" width="76" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="278" y="199" text-anchor="middle" fill="#7DD3FC">PHP</text>

    <rect x="326" y="178" width="92" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="372" y="199" text-anchor="middle" fill="#7DD3FC">MySQL</text>

    <rect x="428" y="178" width="116" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="486" y="199" text-anchor="middle" fill="#7DD3FC">JavaScript</text>

    <rect x="554" y="178" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="607" y="199" text-anchor="middle" fill="#7DD3FC">Power BI</text>
  </g>
</svg>
